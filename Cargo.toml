[workspace]
members = [
    "crates/capability-engine",
    "crates/capability-protocol",
    "crates/capctl",
    "crates/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
blake3 = "1.8.2"
capability-engine = { version = "0.1.0", path = "crates/capability-engine" }
capability-protocol = { version = "0.1.0", path = "crates/capability-protocol" }
clap = { version = "4.5.47", features = ["derive"] }
divan = "0.1.21"
proptest = "1.7.0"
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tempfile = "3.21.0"
thiserror = "2.0.16"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
unicode-normalization = "0.1.24"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
